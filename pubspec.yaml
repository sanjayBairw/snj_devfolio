name: snj_devfolio
description: SNJ Devfolio — Professional Flutter developer portfolio with remote project management.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.3
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  http: ^1.2.2
  file_picker: ^8.3.7
  syncfusion_flutter_pdf: ^35.1.40+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/images/
    - assets/document/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/Neon SNJ Devfolio Logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo/Neon SNJ Devfolio Logo.png"
  windows:
    generate: true
    image_path: "assets/logo/Neon SNJ Devfolio Logo.png"
